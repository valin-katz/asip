<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>ADRA AI | Coming Soon</title>
  <meta name="description" content="ADRA AI coming soon. A Rescue Every Soul Quickly (ResQ) Venture."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet"/>
  
  <style>
    /* ═══════════════════════════════════════════════════════════════
       ADRA AI Intelligence — Minimalist Coming Soon
       ResQ Venture Ecosystem
    ═══════════════════════════════════════════════════════════════ */
    
    :root {
      --bg-main:       #0A0C10;
      --bg-surface:    #12151C;
      --bg-card:       #181C26;
      --brand-red:        #C91D2E;
      --brand-red-hover:  #A81423;
      
      --text-main:     #FFFFFF;
      --text-muted:    #94A3B8;
      --text-dim:      #64748B;
      
      --border-strong: #374151;
      --border-subtle: #242936;
      --radius-sm:     4px;
    }
    
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .svg-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      vertical-align: middle;
    }
    .svg-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Header / Top badge area */
    header {
      padding: 40px 20px 0;
      text-align: center;
    }

    .nav-adra-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .adra-title {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .adra-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      background: var(--brand-red);
      color: #FFFFFF;
      border-radius: var(--radius-sm);
    }
    
    /* Center Content Container */
    .main-content {
      max-width: 650px;
      padding: 20px;
      text-align: center;
    }
    
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      margin-bottom: 24px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--bg-surface);
    }

    .hero-badge-icon {
      width: 14px;
      height: 14px;
      color: var(--brand-red);
    }
    
    h1 {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    h1 span.highlight {
      color: var(--brand-red);
    }
    
    .hero-desc {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Compact Mail Notification Bar */
    .waitlist-form {
      display: flex;
      gap: 8px;
      max-width: 420px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 6px;
      border-radius: var(--radius-sm);
    }

    .waitlist-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 0 12px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
    }

    .waitlist-input::placeholder {
      color: var(--text-dim);
    }

    .waitlist-btn {
      background: var(--brand-red);
      color: #FFFFFF;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
    }

    .waitlist-btn:hover {
      background: var(--brand-red-hover);
    }
    
    /* Footer Area */
    footer {
      padding: 0 20px 40px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      .waitlist-form {
        flex-direction: column;
        background: transparent;
        border: none;
        padding: 0;
      }
      .waitlist-input {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        padding: 12px;
        border-radius: var(--radius-sm);
        margin-bottom: 8px;
      }
      .waitlist-btn {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-adra-badge">
      <span class="svg-icon" style="color: var(--brand-red); width: 22px; height: 22px;">
        <svg viewBox="0 0 24 24"><polygon points="12 2 2 22 22 22 12 2"/></svg>
      </span>
      <div class="adra-title">ADRA <span class="adra-tag">AI</span></div>
    </div>
  </header>

  <main class="main-content">
    <div class="hero-badge">
      <span class="svg-icon hero-badge-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg></span>
      A Rescue Every Soul Quickly (ResQ) Venture
    </div>
    
    <h1>ADRA AI <br><span class="highlight">Coming Soon</span></h1>
    
    <p class="hero-desc">
      Initialising operational core architecture. The next generation of intelligence is currently processing under the ResQ Venture framework.
    </p>

    <div class="waitlist-form">
      <input type="email" class="waitlist-input" id="waitlistEmail" placeholder="Enter your email for early access..." aria-label="Email Address">
      <button class="waitlist-btn" type="button" onclick="alert('Thank you! You have been added to the ADRA AI waitlist.')">Notify Me</button>
    </div>
  </main>

  <footer>
    <div>© 2026 Adra Co-operation. All rights reserved.</div>
  </footer>

</body>
</html>
